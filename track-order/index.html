<main id="main">
    <section class="page-head">
      <h1>Track Your Order</h1>
      <p>Enter your order ID and the mobile number used when ordering.</p>
    </section>
    <section class="section section-narrow">
      <div class="panel">
        <form class="form" id="trackForm" novalidate>
          <label>Order ID <span class="req">*</span>
            <input id="tr_order" required placeholder="PR-2026-00001" maxlength="40">
          </label>
          <label>Mobile Number <span class="req">*</span>
            <input id="tr_mobile" required inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">
          </label>
          <button class="btn orange" id="trackBtn" type="submit">TRACK ORDER</button>
        </form>
      </div>
      <div id="trackResult"></div>
    </section>
