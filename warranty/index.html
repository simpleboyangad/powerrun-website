<div id="pr-header"></div>
<main id="main">
    <section class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="color:#999"><a href="/">Home</a> / <span aria-current="page" style="color:#fff">Warranty Registration</span></nav>
      <h1>Warranty Registration</h1>
      <p>Register your PowerRun product to activate its warranty. Keep your invoice handy — you will need the serial and invoice number.</p>
    </section>
    <section class="section section-narrow">
      <div class="panel">
        <form class="form" id="warrantyForm" novalidate>
          <div class="form-grid">
            <label>Full Name <span class="req">*</span><input id="wr_name" required maxlength="120" autocomplete="name"></label>
            <label>Mobile Number <span class="req">*</span><input id="wr_mobile" required inputmode="numeric" maxlength="10" autocomplete="tel-national"></label>
          </div>
          <label>Email Address<input id="wr_email" type="email" maxlength="160" autocomplete="email"></label>
          <label>Product <span class="req">*</span>
            <select id="wr_product" required><option value="">Select your product…</option></select>
          </label>
          <div class="form-grid">
            <label>Serial Number <span class="req">*</span><input id="wr_serial" required maxlength="80" placeholder="Printed on the product label"></label>
            <label>Purchase Date<input id="wr_purchase_date" type="date"></label>
          </div>
          <div class="form-grid">
            <label>Invoice Number<input id="wr_invoice" maxlength="80"></label>
            <label>Dealer / Seller Name<input id="wr_dealer" maxlength="120"></label>
          </div>
          <label>Installation Address<textarea id="wr_address" maxlength="400"></textarea></label>
          <div class="form-grid">
            <label>City<input id="wr_city" maxlength="80"></label>
            <label>State<select id="wr_state"></select></label>
          </div>
          <label>Pincode<input id="wr_pincode" inputmode="numeric" maxlength="6" style="max-width:220px"></label>
          <button class="btn orange" id="warrantyBtn" type="submit">REGISTER WARRANTY</button>
        </form>
      </div>
    </section>
