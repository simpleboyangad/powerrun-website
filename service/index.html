<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="pr-header"></div>
<main id="main">
    <section class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="color:#999"><a href="/">Home</a> / <span aria-current="page" style="color:#fff">Service Request</span></nav>
      <h1>Service Request</h1>
      <p>Raise a service ticket for any PowerRun product. You will receive a service ID you can quote to our support team.</p>
    </section>
    <section class="section section-narrow">
      <div class="panel">
        <form class="form" id="serviceForm" novalidate>
          <div class="form-grid">
            <label>Full Name <span class="req">*</span><input id="sv_name" required maxlength="120" autocomplete="name"></label>
            <label>Mobile Number <span class="req">*</span><input id="sv_mobile" required inputmode="numeric" maxlength="10" autocomplete="tel-national"></label>
          </div>
          <label>Email Address<input id="sv_email" type="email" maxlength="160" autocomplete="email"></label>
          <label>Product <span class="req">*</span>
            <select id="sv_product" required><option value="">Select your product…</option></select>
          </label>
          <div class="form-grid">
            <label>Serial Number<input id="sv_serial" maxlength="80"></label>
            <label>Purchase Date<input id="sv_purchase_date" type="date"></label>
          </div>
          <label>Issue Type <span class="req">*</span>
            <select id="sv_issue_type" required>
              <option value="">Select the type of issue…</option>
              <option>Not powering on</option>
              <option>Not charging</option>
              <option>Low backup / runtime</option>
              <option>Display or error code</option>
              <option>Physical damage</option>
              <option>Installation support</option>
              <option>Other</option>
            </select>
          </label>
          <label>Describe the Issue <span class="req">*</span>
            <textarea id="sv_description" required maxlength="1500" placeholder="Tell us what is happening, when it started and any error codes shown."></textarea>
          </label>
          <div class="form-grid">
            <label>City<input id="sv_city" maxlength="80"></label>
            <label>State<select id="sv_state"></select></label>
          </div>
          <label>Address<textarea id="sv_address" maxlength="400"></textarea></label>
          <label>Pincode<input id="sv_pincode" inputmode="numeric" maxlength="6" style="max-width:220px"></label>
          <button class="btn orange" id="serviceBtn" type="submit">SUBMIT SERVICE REQUEST</button>
        </form>
      </div>
    </section>

</main>
