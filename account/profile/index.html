<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Details | PowerRun Industries</title>
<meta name="description" content="Your saved PowerRun Industries delivery details.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff5a00">
<link rel="icon" href="/assets/powerrun-logo.png">
<link rel="stylesheet" href="/assets/css/site.css?v=acd620ce">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="pr-header"></div>
<main id="main">
    <section class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="color:#999"><a href="/">Home</a> / <a href="/account/">My Account</a> / <span aria-current="page" style="color:#fff">My Details</span></nav>
      <h1>My Details</h1>
      <p>Saved here so checkout fills itself in next time.</p>
    </section>
    <section class="section">
      <div id="accountNav"></div>
      <div class="cart-layout">
        <div class="panel">
          <h2>Delivery Details</h2>
          <form class="form" id="profileForm" novalidate>
            <div class="form-grid">
              <label>Full Name <span class="req">*</span><input id="pf_name" required maxlength="120" autocomplete="name"></label>
              <label>Mobile Number<input id="pf_mobile" inputmode="numeric" maxlength="10" autocomplete="tel-national"></label>
            </div>
            <label>Email Address<input id="pf_email" type="email" maxlength="160" readonly></label>
            <label>Address<textarea id="pf_address" maxlength="400" autocomplete="street-address"></textarea></label>
            <div class="form-grid">
              <label>City<input id="pf_city" maxlength="80"></label>
              <label>State<select id="pf_state"></select></label>
            </div>
            <label>Pincode<input id="pf_pincode" inputmode="numeric" maxlength="6" style="max-width:220px"></label>
            <button class="btn orange" id="profileBtn" type="submit">SAVE MY DETAILS</button>
          </form>
        </div>

        <div class="panel">
          <div class="panel-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2 style="margin:0">Saved Addresses</h2>
            <button class="outline" type="button" id="addAddressBtn">+ ADD ADDRESS</button>
          </div>
          <div id="addressFormWrap" hidden>
            <form class="form" id="addressForm" novalidate style="margin-bottom:18px;border:1px solid var(--line);border-radius:10px;padding:16px">
              <div id="addressFormMessage"></div>
              <div class="form-grid">
                <label>Label<input id="af_label" maxlength="40" placeholder="Home, Office…"></label>
                <label>Full Name <span class="req">*</span><input id="af_name" required maxlength="120"></label>
              </div>
              <div class="form-grid">
                <label>Mobile Number <span class="req">*</span><input id="af_mobile" required inputmode="numeric" maxlength="10"></label>
                <label>Pincode <span class="req">*</span><input id="af_pincode" required inputmode="numeric" maxlength="6"></label>
              </div>
              <label>Address <span class="req">*</span><textarea id="af_address" required maxlength="400"></textarea></label>
              <div class="form-grid">
                <label>City <span class="req">*</span><input id="af_city" required maxlength="80"></label>
                <label>State <span class="req">*</span><select id="af_state" required></select></label>
              </div>
              <label class="small-note" style="display:flex;align-items:center;gap:8px;font-weight:400">
                <input id="af_default" type="checkbox" style="width:auto"> Set as default address</label>
              <div class="page-actions" style="display:flex;gap:10px;justify-content:flex-end">
                <button class="outline" type="button" id="cancelAddressBtn">Cancel</button>
                <button class="btn orange" type="submit" id="saveAddressBtn">SAVE ADDRESS</button>
              </div>
            </form>
          </div>
          <div id="addressList"></div>
        </div>

        <aside>
          <div class="panel">
            <h2>Account</h2>
            <p class="small-note" id="profileWho"></p>
            <button class="outline block" type="button" id="changePasswordBtn" style="margin-top:10px">CHANGE PASSWORD</button>
            <button class="outline block" type="button" id="signOutBtn" style="margin-top:8px">SIGN OUT</button>
          </div>
        </aside>
      </div>
    </section>

</main>
<div id="pr-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js?v=acd620ce"></script>
<script src="/assets/js/core.js?v=acd620ce"></script>
<script src="/assets/js/seo.js?v=acd620ce"></script>
<script src="/assets/js/cart.js?v=acd620ce"></script>
<script src="/assets/js/layout.js?v=acd620ce"></script>
<script src="/assets/js/catalog.js?v=acd620ce"></script>
<script src="/assets/js/account.js?v=acd620ce"></script>
<script src="/assets/js/pages/account-profile.js?v=acd620ce"></script>
</body>
</html>
