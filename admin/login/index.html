<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In | PowerRun Admin</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141414">
<link rel="icon" href="/assets/powerrun-logo.png">
<link rel="stylesheet" href="/assets/css/admin.css?v=a0cd10af">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <img src="/assets/powerrun-logo.png" alt="PowerRun Industries">
    <h1>Admin Sign In</h1>
    <p class="sub">Authorised PowerRun Industries staff only.</p>
    <div id="loginNotice"></div>
    <form class="form" id="loginForm" novalidate>
      <label>Email Address <span class="req">*</span>
        <input id="lg_email" type="email" required autocomplete="username" autofocus>
      </label>
      <label>Password <span class="req">*</span>
        <input id="lg_password" type="password" required autocomplete="current-password">
      </label>
      <button class="btn block" id="loginBtn" type="submit">SIGN IN</button>
    </form>
    <a class="back" href="/">&larr; Back to powerrun.in</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.js"></script>
<script src="/assets/js/config.js?v=a0cd10af"></script>
<script src="/assets/js/core.js?v=a0cd10af"></script>
<script src="/assets/js/admin/shell.js?v=a0cd10af"></script>
<script src="/assets/js/admin/login.js?v=a0cd10af"></script>
</body>
</html>
