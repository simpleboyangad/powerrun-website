<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Quotation | PowerRun Industries</title>
<meta name="description" content="View your PowerRun Industries quotation with your quote number and registered mobile number.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://powerrun.in/quote/">
<meta name="theme-color" content="#ff5a00">
<link rel="icon" href="/assets/powerrun-logo.png">
<link rel="preconnect" href="https://nnkopxkyxcmtiunftlgr.supabase.co" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css?v=184cc361">
<style>
@media print {
  #pr-header, #pr-footer, .no-print, .page-head, #quoteViewForm, .skip-link, .detail-actions, #quoteViewForm + * { display: none !important; }
  body { background: #fff !important; }
  .panel { box-shadow: none !important; border: none !important; }
  #quoteViewResult { margin: 0; }
  .section-narrow > .panel:first-child { display: none !important; }
  @page { size: A4; margin: 14mm; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="pr-header"></div>
<main id="main">
    <section class="page-head">
      <h1>Your Quotation</h1>
      <p>Enter your quote number and the mobile number you gave while requesting the quote.</p>
    </section>
    <section class="section section-narrow">
      <div class="panel">
        <form class="form" id="quoteViewForm" novalidate>
          <label>Quote No <span class="req">*</span>
            <input id="qv_no" required placeholder="PRI/QTN/2026-27/0001" maxlength="40">
          </label>
          <label>Mobile Number <span class="req">*</span>
            <input id="qv_mobile" required inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">
          </label>
          <button class="btn orange" id="quoteViewBtn" type="submit">VIEW QUOTE</button>
        </form>
      </div>
      <div id="quoteViewResult"></div>
    </section>
</main>
<div id="pr-footer"></div>

</body>
</html>
