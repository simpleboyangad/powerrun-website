<body>

<div id="pr-header"></div>
<main id="main">
    <section class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="color:#999"><a href="/">Home</a> / <span aria-current="page" style="color:#fff">Dealer Enquiry</span></nav>
      <h1>Become a PowerRun Dealer</h1>
      <p>Partner with PowerRun Industries for lithium batteries, hybrid inverters and solar. Attractive margins, technical training and marketing support.</p>
    </section>
    <section class="section section-narrow">
      <div class="panel">
        <form class="form" id="dealerForm" novalidate>
          <div class="form-grid">
            <label>Contact Name <span class="req">*</span><input id="dl_name" required maxlength="120" autocomplete="name"></label>
            <label>Company / Firm Name<input id="dl_company" maxlength="160" autocomplete="organization"></label>
          </div>
          <div class="form-grid">
            <label>Mobile Number <span class="req">*</span><input id="dl_mobile" required inputmode="numeric" maxlength="10" autocomplete="tel-national"></label>
            <label>Email Address<input id="dl_email" type="email" maxlength="160" autocomplete="email"></label>
          </div>
          <div class="form-grid">
            <label>City<input id="dl_city" maxlength="80"></label>
            <label>State<select id="dl_state"></select></label>
          </div>
          <label>Business Type
            <select id="dl_business_type">
              <option value="">Select your business type…</option>
              <option>Retailer / Shop</option>
              <option>Distributor</option>
              <option>Solar EPC / Installer</option>
              <option>Electrical Contractor</option>
              <option>E-Rickshaw Dealer</option>
              <option>System Integrator</option>
              <option>New Business</option>
              <option>Other</option>
            </select>
          </label>
          <label>Tell us about your requirement
            <textarea id="dl_message" maxlength="1500" placeholder="Products of interest, expected monthly volume, area you cover."></textarea>
          </label>
          <button class="btn orange" id="dealerBtn" type="submit">SUBMIT DEALER ENQUIRY</button>
        </form>
      </div>
    </section>
